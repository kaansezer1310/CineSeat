<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="SPIDER-MAN BRAND NEW DAY afisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3a0d18"/>
      <stop offset="100%" stop-color="#7a1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#f0524d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f0524d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>

  <!-- ufuk cizgisi -->
  <circle cx="200" cy="215" r="86" fill="none" stroke="#f0524d" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="200" cy="215" r="58" fill="none" stroke="#f0524d" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M0 300 L400 300" stroke="#f0524d" stroke-opacity="0.35" stroke-width="1"/>

  <text x="200" y="52" text-anchor="middle" fill="#f0524d" fill-opacity="0.85"
        font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="5">Marvel Studios</text>

  <text x="200" y="379" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2">SPIDER-MAN</text>
  <text x="200" y="421" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="2">BRAND NEW DAY</text>

  <text x="200" y="516" text-anchor="middle" fill="#ffffff" fill-opacity="0.72"
